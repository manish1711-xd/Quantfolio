[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio"
version = "3.0.1"
description = "Portfolio risk, performance, optimisation and ML forecasting terminal for Indian and global markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aakash" }]
keywords = [
    "portfolio",
    "risk",
    "quantitative-finance",
    "machine-learning",
    "forecasting",
    "streamlit",
    "nse",
    "analytics",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
    "plotly>=5.20",
    "streamlit>=1.50",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-openpyxl",
]

[project.urls]
Repository = "https://github.com/your-handle/quantfolio"

[tool.setuptools]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::FutureWarning",
    "error::DeprecationWarning:src.*",
    # yfinance/urllib3 emit deprecations we do not control
    "ignore::DeprecationWarning:yfinance.*",
    "ignore::DeprecationWarning:urllib3.*",
]
markers = [
    "slow: tests that take more than a second",
    "network: tests that require internet access (deselected by default in CI)",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # returns
    "ARG",  # unused arguments
    "PD",   # pandas-vet
    "NPY",  # numpy
    "BLE",  # blind-except: allowed only at IO/UI boundaries, each with a noqa reason
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "PD010",   # .pivot is intentional in the monthly return table
    "PD011",   # .values on a Series is the clearest way to hand numpy an array
    "PD008",   # .at is the right accessor for scalar lookups in tight loops
    "RUF001",  # ambiguous unicode (currency symbols, em dashes) is deliberate
    "RUF003",
    "RUF022",  # __all__ is grouped by source module on purpose, not alphabetised
    "RUF046",  # int(round(...)) / int(argmax(...)) states intent; the cast stays
    "B008",
    # zip() over columns of the same DataFrame is length-safe by construction.
    # Threading strict= through ~30 such call sites would add noise without
    # catching a bug this codebase can actually have.
    "B905",
    "UP017",   # datetime.timezone.utc reads more explicitly than datetime.UTC
    "SIM108",  # an explicit if/else is often clearer than a nested ternary
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PD", "SIM"]
"src/ui/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(^\\.venv/|^build/|^dist/)"

[[tool.mypy.overrides]]
module = ["yfinance.*", "plotly.*", "streamlit.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["src/ui/*", "*/__init__.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
